name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      trace_sse:
        description: 'Diagnostic-only Windows CPU/idle trace; never publish or replace acceptance'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.trace_sse
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.trace_sse
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-bounded.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sse-diagnostic-${{ github.run_id }}
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.trace_sse
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: cp stream-quality.js web/stream-quality.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.trace_sse
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack && sha256sum *.tgz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
            SHA256SUMS.txt
